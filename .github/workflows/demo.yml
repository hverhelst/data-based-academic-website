# Publishes exampleSite/ to GitHub Pages, so the theme has a live demo and a
# standing proof that it builds on its own — not only inside someone's site.
name: Deploy demo site

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo CLI
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - uses: actions/configure-pages@v5
        id: pages
      # The demo advertises a CV link in its navigation, so it has to build the
      # PDF too; without this the link 404s. It also exercises the LaTeX path
      # against the demo's data on every deploy.
      - name: Install TeX Live (LuaLaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-science texlive-fonts-recommended
      - name: Compile CV
        run: bash compile_CV.sh
        env:
          SITE_ROOT: ${{ github.workspace }}/exampleSite
      # The demo is served from a repository subpath, not an apex domain, so
      # baseURL has to come from the Pages configuration rather than hugo.toml.
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --source exampleSite --themesDir ../.. --minify \
               --baseURL "${{ steps.pages.outputs.base_url }}/" \
               --destination public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./exampleSite/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
